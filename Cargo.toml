[workspace]
members = ["benchmarks", "cli", "console"]

[workspace.dependencies]
datafusion = { version = "53.0.0", default-features = false }
datafusion-proto = { version = "53.0.0" }

[package]
name = "datafusion-distributed"
version = "1.0.0"
edition = "2024"
description = "Framework for enhancing Apache DataFusion with distributed capabilities"
license = "Apache-2.0"
documentation = "https://datafusion-contrib.github.io/datafusion-distributed/"
repository = "https://github.com/datafusion-contrib/datafusion-distributed"

[dependencies]
chrono = { version = "0.4.44" }
datafusion = { workspace = true, features = [
  "parquet",
  "sql",
  "unicode_expressions",
  "datetime_expressions",
] }
datafusion-proto = { workspace = true }
arrow-flight = "58"
arrow-select = "58"
arrow-ipc = { version = "58", features = ["zstd"] }
async-trait = "0.1.89"
tokio = { version = "1.48", features = ["full"] }
tonic = { version = "0.14.1", features = ["transport"] }
tower = "0.5.2"
http = "1.3.1"
itertools = "0.14.0"
futures = "0.3.31"
url = "2.5.7"
uuid = "1.19"
delegate = "0.13.4"
dashmap = "6.0.1"
prost = "0.14.1"
rand = "0.9"
object_store = "0.13"
bytes = "1.11"
pin-project = "1.1.10"
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = "0.7"
moka = { version = "0.12", features = ["sync", "future"] }
crossbeam-queue = "0.3"
sysinfo = { version = "0.30", optional = true }
sketches-ddsketch = { version = "0.3", features = ["use_serde"] }
bincode = "1"
tonic-prost = "0.14.2"

# integration_tests deps
insta = { version = "1.46.0", features = ["filters"], optional = true }
parquet = { version = "58", optional = true }
arrow = { version = "58", optional = true, features = ["test_utils"] }
hyper-util = { version = "0.1.16", optional = true }

[features]
avro = ["datafusion/avro"]
integration = [
  "insta",
  "parquet",
  "arrow",
  "hyper-util",
]

system-metrics = ["sysinfo"]

tpch = ["integration"]
tpcds = ["integration"]
clickbench = ["integration"]
sysinfo = ["dep:sysinfo"]

[dev-dependencies]
datafusion-distributed-benchmarks = { path = "benchmarks" }
structopt = "0.3"
insta = { version = "1.46.0", features = ["filters"] }
parquet = "58"
arrow = { version = "58", features = ["test_utils"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
hyper-util = "0.1.16"
pretty_assertions = "1.4"
test-case = "3.3.1"

[patch.crates-io]
# pydantic-main @ tag 58.0.0 w/
# - sparse data fix: https://github.com/apache/arrow-rs/pull/9509
# - public Sbbf methods: https://github.com/apache/arrow-rs/pull/9569
# - string view unshred variant: https://github.com/apache/arrow-rs/pull/9514
# - fix extend_nulls panic for UnionArray: https://github.com/apache/arrow-rs/pull/9607
arrow = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-arith = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-array = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-buffer = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-cast = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-csv = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-data = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-ipc = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-json = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-ord = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-row = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-schema = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-select = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
arrow-string = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }
parquet = { git = "https://github.com/pydantic/arrow-rs.git", branch = "pydantic-main" }

# pydantic-main @ b4116da0d: upstream main with:
# - union coercion fixes: https://github.com/apache/datafusion/issues/18825
# - GC spilling fix: https://github.com/apache/datafusion/pull/19444
# - add arrow_try_cast UDF: https://github.com/apache/datafusion/pull/21130
# - leaf-level ProjectionMask for parquet projections: https://github.com/apache/datafusion/pull/20925
# - parquet Variant UDF filter pushdown with leaf pruning
# - support union comparison for try-cast
datafusion = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main" }
datafusion-common = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main" }
datafusion-expr = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main" }
datafusion-execution = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main" }
datafusion-sql = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main" }
datafusion-proto = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main" }
datafusion-datasource = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main" }
datafusion-physical-expr-adapter = { git = "https://github.com/pydantic/datafusion.git", branch = "pydantic-main" }
